<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversion Cost Analysis AI Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }


        /* Power BI */
        .powerbi {
            width: 72%;
            height: 100%;
            border-right: 1px solid #ddd;
        }


        /* Copilot */
        .copilot {
            width: 28%;
            height: 100%;
        }


        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }


        @media(max-width:900px){

            .container{
                flex-direction: column;
            }

            .powerbi{
                width:100%;
                height:65%;
                border-right:none;
                border-bottom:1px solid #ddd;
            }

            .copilot{
                width:100%;
                height:35%;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- POWER BI -->

    <div class="powerbi">

        <iframe
            src="https://app.powerbi.com/reportEmbed?reportId=8aba2aee-7589-4d95-9fa0-2e34103e403f&autoAuth=true&ctid=5069cde4-642a-45c0-8094-d0c2dec10be3"
            allowfullscreen="true">
        </iframe>

    </div>



    <!-- COPILOT -->

    <div class="copilot">

        <iframe
            src="https://copilotstudio.microsoft.com/environments/Default-5069cde4-642a-45c0-8094-d0c2dec10be3/bots/cr981_abc/webchat?__version__=2">
        </iframe>

    </div>


</div>


</body>

</html>
