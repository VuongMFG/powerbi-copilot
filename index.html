<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Conversion Cost Analysis AI Dashboard
</title>


<style>


* {
    box-sizing: border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
    Arial, Helvetica, sans-serif;

}



/* ======================
   MAIN LAYOUT
====================== */


.container {

    display:flex;

    width:100vw;

    height:100vh;

}



/* ======================
   POWER BI
====================== */


.powerbi {

    width:72%;

    height:100%;

    border-right:1px solid #ddd;

}


.powerbi iframe {

    width:100%;

    height:100%;

    border:none;

}



/* ======================
   AI CHAT
====================== */


.copilot {

    width:28%;

    height:100%;

    display:flex;

    flex-direction:column;

}



/* Header */


.chat-header {

    height:50px;

    padding:15px;

    border-bottom:1px solid #ddd;

    font-weight:bold;

}



/* Messages */


#messages {


    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#fafafa;

}



/* Message bubble */


.message {

    margin-bottom:12px;

    padding:10px;

    border-radius:8px;

    max-width:90%;

    line-height:1.4;

}


.user-message {

    background:#e3f2fd;

    margin-left:auto;

}


.ai-message {

    background:#eeeeee;

}



/* Input */


.chat-input {


    display:flex;

    border-top:1px solid #ddd;

    padding:10px;


}



.chat-input input {


    flex:1;

    height:38px;

    padding:8px;


    border:1px solid #ccc;

    border-radius:5px;


}



.chat-input button {


    margin-left:8px;

    width:70px;

    border:none;

    border-radius:5px;

    cursor:pointer;

    background:#0078d4;

    color:white;


}



/* ======================
   MOBILE
====================== */


@media(max-width:900px){


.container {

    flex-direction:column;

}



.powerbi {

    width:100%;

    height:65%;

    border-right:none;

    border-bottom:1px solid #ddd;

}



.copilot {

    width:100%;

    height:35%;

}



}



</style>


</head>



<body>



<div class="container">



<!-- ======================
     POWER BI REPORT
====================== -->


<div class="powerbi">


<iframe

src="https://app.powerbi.com/reportEmbed?reportId=8aba2aee-7589-4d95-9fa0-2e34103e403f&autoAuth=true&ctid=5069cde4-642a-45c0-8094-d0c2dec10be3"

allowfullscreen="true">

</iframe>


</div>





<!-- ======================
     AI CHAT
====================== -->


<div class="copilot">



<div class="chat-header">

Conversion Cost AI Assistant

</div>



<div id="messages">


<div class="message ai-message">

Hello! I am your Conversion Cost AI Assistant.
<br><br>

Ask me about:
<br>
- Cost trend
<br>
- CC Rate changes
<br>
- Supplier performance
<br>
- Monthly variance

</div>


</div>





<div class="chat-input">


<input

id="messageInput"

placeholder="Ask about conversion cost..."

onkeypress="handleEnter(event)"

>



<button onclick="sendMessage()">

Send

</button>


</div>



</div>



</div>






<script>


// ======================
// SEND MESSAGE
// ======================


async function sendMessage(){



const input =
document.getElementById("messageInput");



const message =
input.value.trim();



if(!message)

return;




addMessage(
message,
"user"
);



input.value="";




// Temporary response
// Later replace by Azure Function API


setTimeout(()=>{


addMessage(

"I received your question. AI connection will be integrated with Copilot Studio.",

"ai"

);


},500);



}




// ======================
// ADD MESSAGE
// ======================


function addMessage(text,type){



const messages =
document.getElementById("messages");



const div =
document.createElement("div");



div.className =
"message " +

(type==="user"
?
"user-message"
:
"ai-message");



div.innerHTML=text;



messages.appendChild(div);



messages.scrollTop =
messages.scrollHeight;



}




// ======================
// ENTER KEY
// ======================


function handleEnter(event){


if(event.key==="Enter"){

sendMessage();

}


}



</script>




</body>

</html>
