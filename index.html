<!DOCTYPE html>
<html lang="en">

    <style>

        html,

            font-family: Arial, sans-serif;
        }

            width: 100vw;
            height: 100vh;
        }

        /* Power BI */
        .powerbi-panel {

            height: 100%;
            border-right: 1px solid #ddd;
        }

        /* Copilot */
        .copilot-panel {
            width: 28%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;

            display: block;

            .app {
                flex-direction: column;
            }

            .powerbi-panel {

                border-right: none;

<div class="app">

    <!-- COPILOT -->
